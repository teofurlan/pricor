[project]
name = "pricor"
version = "0.1.0"
description = "Turns heterogeneous supplier price lists into a normalized catalog."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
# Training and running the fine-tuned column classifier. The base install stays torch-free.
laya = [
    "laya==0.4.6",
    "torch==2.14.1",
]

[project.scripts]
pricor = "pricor.entrypoints.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "xlwt>=1.3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "laya", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in smoke tests against a running Ollama (run with: uv run pytest -m live -s)",
]
