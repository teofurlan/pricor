[project]
name = "pricor"
version = "0.1.0"
description = "Turns heterogeneous supplier price lists into a normalized catalog."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pricor = "pricor.entrypoints.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
